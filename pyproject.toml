[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reproducible-build-verifier"
version = "0.1.0"
description = "Deterministic build auditor verifying that compiled artifacts and wheels are bit-for-bit reproducible across environments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-reproducible-build-verifier = "agent_reproducible_build_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_reproducible_build_verifier*"]
